AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  kiro-minions orchestrator — Jira webhook -> API Gateway -> Orchestrator Lambda
  (validate, claim, enqueue -> 202) -> SQS (+DLQ) -> Consumer Lambda ->
  AgentCore Runtime (invoke). The AgentCore Runtime runs the deterministic fix
  pipeline AND writes its own terminal job status to DynamoDB. Idempotency is
  keyed on sonar_hash with a lease so stale in_flight rows become reclaimable.
  NOTE (review finding #6): this template (SSM-secure WEBHOOK_SECRET dynamic
  reference, DefaultRouteSettings throttling, DLQ/visibility sizing) could not be
  `sam validate`d in the build sandbox (no sam/AWS CLI/PyYAML). Validate it in CI
  / the deploy pipeline (`sam validate --lint`) before relying on it.

Parameters:
  AgentCoreRuntimeArn:
    Type: String
    Description: ARN of the AgentCore Runtime to invoke (bedrock-agentcore:InvokeRuntime).
  JiraBaseUrl:
    Type: String
    Default: https://your-org.atlassian.net
    Description: Jira base URL, used to build ticket backlinks.
  LeaseSeconds:
    Type: String
    Default: '3600'
    Description: >
      How long a claimed (in_flight) job's lease is valid, in seconds. After it
      expires, a stale in_flight row is reclaimable by a later webhook so a
      crashed/timed-out consumer cannot wedge a sonar_hash forever. This is the
      authoritative reclaim gate (see _claim_job); DynamoDB TTL below is only
      best-effort row cleanup.
  # Webhook authentication secret (#5). We take the NAME of a SecureString SSM
  # parameter here (not the secret itself) and resolve its VALUE at deploy time
  # via the {{resolve:ssm-secure:...}} dynamic reference below, so the secret is
  # NEVER hardcoded in the template or in stack parameters history. (Secrets
  # Manager would work equally well via {{resolve:secretsmanager:...}}; the SSM
  # SecureString route is the simpler/cheaper option.)
  WebhookSecretSsmName:
    Type: String
    Default: /kiro-minions/webhook-secret
    Description: >
      Name of a SecureString SSM parameter holding the webhook shared
      secret / HMAC key. Its VALUE is injected into the orchestrator as
      WEBHOOK_SECRET; the value itself is never stored in this template.
  RepoAllowlist:
    Type: String
    Default: ''
    Description: >
      Comma/whitespace separated owner/repo glob patterns (e.g.
      "your-org/* other-org/repo") the orchestrator will accept. Empty means
      no allowlist (allow all repos). Injected as REPO_ALLOWLIST on the
      orchestrator; the AgentCore Runtime re-checks the same value set
      out-of-band on its own env (defence in depth).

  # --- Kiro IDE ingress: OIDC/JWT authorizer (ADR-001) ---------------------
  # The IDE ingress (POST /tasks) and the status poll (GET /tasks/{task_id})
  # sit behind an HTTP API JWT authorizer so API Gateway VERIFIES the developer
  # token before the Lambda runs; the Lambda only READS the verified claims
  # (sub/email -> actor). These two parameters configure the OIDC issuer and the
  # expected audience for that authorizer. They do not affect the Jira webhook,
  # which keeps its existing shared-secret/HMAC verification.
  OidcIssuerUrl:
    Type: String
    Default: https://your-idp.example.com/
    Description: >
      OIDC issuer URL (the authorizer's ``issuer``) whose tokens authenticate
      Kiro IDE developers on POST /tasks and GET /tasks/{task_id}. The issuer
      must expose the standard OIDC discovery / JWKS endpoints.
  OidcAudience:
    Type: CommaDelimitedList
    Default: kiro-minions-ide
    Description: >
      Allowed JWT audience value(s) for the IDE authorizer. A token is accepted
      only when its ``aud`` claim matches one of these.

  # --- ADR-007 A: Lambda reserved concurrency guardrails -------------------
  # Cap how far the ingress and consumer can fan out so a burst of IDE
  # dispatches cannot scale cost / blast radius without bound. Tune to the
  # account's Lambda concurrency and the acceptable AgentCore/Bedrock spend.
  IngressReservedConcurrency:
    Type: Number
    Default: 10
    Description: >
      Reserved (max) concurrent executions for the IDE IngressFunction. Bounds
      how many simultaneous POST /tasks dispatches run; excess requests are
      throttled by Lambda (the IDE can retry).
  ConsumerReservedConcurrency:
    Type: Number
    Default: 5
    Description: >
      Reserved (max) concurrent executions for the ConsumerFunction. This is the
      effective AgentCore worker cap (ADR-007 B): SQS buffers the rest, so only
      this many Runtime invokes run at once regardless of queue depth.

  # --- ADR-007 C: per-actor dispatch quota ---------------------------------
  ActorQuotaMax:
    Type: Number
    Default: 0
    Description: >
      Max IDE dispatches per developer identity (actor) per window. 0 means
      UNLIMITED (quota disabled). Enforced in handler_ide via a DynamoDB-backed
      atomic counter BEFORE any claim/enqueue; over the limit returns HTTP 429.
  ActorQuotaWindowSeconds:
    Type: Number
    Default: 3600
    Description: >
      Length of the fixed per-actor quota window in seconds (default 1 hour).

  # --- ADR-007 D: cost guardrail (ALERT-ONLY budget) -----------------------
  # An AWS Budgets alert on monthly spend that NOTIFIES an SNS topic when a
  # threshold is crossed. This is deliberately NOT a hard fail-closed cap: a
  # hard dispatch cap can block legitimate work, so enforcing one is DEFERRED
  # until real usage is observed (ADR-007 D).
  MonthlyBudgetLimit:
    Type: Number
    Default: 500
    Description: >
      Monthly cost budget limit (USD) for the alert-only AWS Budget. Crossing
      the alert threshold notifies the SNS topic below; it never blocks work.
  BudgetAlertSnsTopicArn:
    Type: String
    Default: ''
    Description: >
      ARN of an SNS topic to notify when the budget alert threshold is crossed.
      When empty, the Budget resource is not created (see the HasBudgetTopic
      condition). Alert-only: no hard spend cap is enforced.

Conditions:
  # Only create the alert-only Budget when an SNS topic ARN is supplied.
  HasBudgetTopic: !Not [!Equals [!Ref BudgetAlertSnsTopicArn, '']]

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 60

Resources:
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kiro-minions-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sonar_hash
          AttributeType: S
      KeySchema:
        - AttributeName: sonar_hash
          KeyType: HASH
      # The numeric `lease_expires_at` attribute already lives on every item
      # (written by the orchestrator's _claim_job). Enabling TTL on it gives
      # eventual, best-effort cleanup of old rows. NOTE: the lease comparison in
      # _claim_job (#l < :now) is the AUTHORITATIVE reclaim gate — a stale
      # in_flight row becomes claimable the instant its lease expires, regardless
      # of when DynamoDB's TTL sweeper actually deletes it. TTL here only reclaims
      # storage; it must not be relied on for correctness.
      TimeToLiveSpecification:
        AttributeName: lease_expires_at
        Enabled: true

  # ---------------------------------------------------------------------------
  # Work queue (#7): the webhook producer enqueues a TicketPayload JSON and the
  # ConsumerFunction drains it to invoke the AgentCore Runtime. Messages that
  # fail delivery maxReceiveCount times are routed to the DLQ.
  # ---------------------------------------------------------------------------
  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: kiro-minions-jobs-dlq
      # Keep failed messages around long enough to inspect/redrive (14 days max).
      MessageRetentionPeriod: 1209600

  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: kiro-minions-jobs
      # VisibilityTimeout must be >= the ConsumerFunction Timeout so an in-flight
      # message is not re-delivered to another consumer mid-processing. AWS
      # guidance is ~6x the function timeout; ConsumerFunction uses 900s, so we
      # set 960s (just over the function timeout plus headroom; 6x would exceed
      # the hard 43200s cap only at much larger timeouts).
      VisibilityTimeout: 960
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 3

  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kiro-minions-orchestrator
      CodeUri: ../orchestrator/
      # Webhook producer entry point: validate, claim, enqueue -> 202.
      Handler: handler.handler
      Environment:
        Variables:
          AGENTCORE_RUNTIME_ARN: !Ref AgentCoreRuntimeArn
          JIRA_BASE_URL: !Ref JiraBaseUrl
          DYNAMODB_TABLE: !Ref JobsTable
          # SQS work queue the producer enqueues TicketPayloads onto (#7).
          SQS_QUEUE_URL: !Ref JobsQueue
          # Lease validity for a claimed in_flight job (#6).
          LEASE_SECONDS: !Ref LeaseSeconds
          # Webhook shared secret / HMAC key (#5). The RESOLVED secret VALUE is
          # pulled from the SecureString SSM parameter at deploy time; the secret
          # is never hardcoded here. verify_webhook() fails closed when this is
          # set and skips verification (fail-open) when it is empty.
          WEBHOOK_SECRET: !Sub '{{resolve:ssm-secure:${WebhookSecretSsmName}}}'
          # Owner/repo allowlist (#5); empty => allow all. The runtime enforces
          # the same list via its own out-of-band REPO_ALLOWLIST env var.
          REPO_ALLOWLIST: !Ref RepoAllowlist
      Policies:
        # The producer no longer invokes the AgentCore Runtime synchronously; it
        # only enqueues. The bedrock-agentcore:InvokeRuntime permission therefore
        # lives on the ConsumerFunction, not here.
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        # Producer only needs to SendMessage to the work queue.
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobsQueue.QueueName
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /webhook
            Method: POST

  # ---------------------------------------------------------------------------
  # SQS consumer (#7): drains JobsQueue and performs the blocking AgentCore
  # invoke. The runtime reports its own terminal status to DynamoDB (#6), so the
  # consumer does NOT block waiting for the whole fix to finish and does NOT
  # write job status itself — it just invokes and lets SQS retry/DLQ on failure.
  # Timeout is generous (900s) because the invoke call can be long-running; the
  # queue VisibilityTimeout above is sized to match so messages are not
  # re-delivered mid-processing.
  # ---------------------------------------------------------------------------
  ConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kiro-minions-consumer
      CodeUri: ../orchestrator/
      Handler: handler.sqs_consumer
      Timeout: 900
      # ADR-007 A/B: cap concurrent consumers. This is the effective AgentCore
      # worker ceiling — SQS buffers everything above it (the queue is the
      # backpressure mechanism), so no new resource is needed for the worker cap.
      ReservedConcurrentExecutions: !Ref ConsumerReservedConcurrency
      Environment:
        Variables:
          AGENTCORE_RUNTIME_ARN: !Ref AgentCoreRuntimeArn
          DYNAMODB_TABLE: !Ref JobsTable
      Policies:
        - Statement:
            - Sid: InvokeAgentCoreRuntime
              Effect: Allow
              Action:
                - bedrock-agentcore:InvokeRuntime
              Resource: !Ref AgentCoreRuntimeArn
        # Receive/Delete/GetQueueAttributes on the work queue for the event
        # source mapping.
        - SQSPollerPolicy:
            QueueName: !GetAtt JobsQueue.QueueName
      Events:
        JobsQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            # One ticket per invoke keeps a failed fix from poisoning a batch of
            # unrelated tickets (each message retries/DLQs independently).
            BatchSize: 1

  # ---------------------------------------------------------------------------
  # Kiro IDE ingress (ADR-002/003/005): POST /tasks
  # -----------------------------------------------------------------------------
  # Producer for per-developer IDE tasks. Same shape as OrchestratorFunction
  # (validate -> per-actor quota -> claim -> enqueue -> 202) but authenticated
  # by the JWT authorizer (ADR-001) instead of the webhook shared secret. It
  # reuses the SAME JobsTable (logical task_id carried in the physical
  # sonar_hash attribute, ADR-004) and the SAME JobsQueue, so the consumer and
  # runtime are unchanged. Result delivery stays a PR via the existing runtime
  # push+PR mechanism (ADR-006) — no new delivery code or resource.
  IngressFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kiro-minions-ingress
      CodeUri: ../orchestrator/
      Handler: handler.handler_ide
      # ADR-007 A: bound how many simultaneous IDE dispatches run.
      ReservedConcurrentExecutions: !Ref IngressReservedConcurrency
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref JobsTable
          SQS_QUEUE_URL: !Ref JobsQueue
          LEASE_SECONDS: !Ref LeaseSeconds
          REPO_ALLOWLIST: !Ref RepoAllowlist
          # ADR-007 C: per-actor dispatch quota (0 => unlimited/disabled).
          ACTOR_QUOTA_MAX: !Ref ActorQuotaMax
          ACTOR_QUOTA_WINDOW_SECONDS: !Ref ActorQuotaWindowSeconds
      Policies:
        # Claim/mark-status + the per-actor quota counter live on the JobsTable.
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        # Ingress only enqueues onto the work queue (the consumer invokes).
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobsQueue.QueueName
      Events:
        CreateTask:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /tasks
            Method: POST
            # ADR-001: require a verified OIDC/JWT token on this route.
            Auth:
              Authorizer: OidcJwtAuthorizer

  # ---------------------------------------------------------------------------
  # Status polling API (ADR-003): GET /tasks/{task_id}
  # -----------------------------------------------------------------------------
  # READ-ONLY. The IDE polls this until a terminal status. Behind the SAME JWT
  # authorizer as the ingress. It performs NO claim/enqueue/mutation, so it only
  # needs read access to the JobsTable (read-only IAM policy).
  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kiro-minions-status
      CodeUri: ../orchestrator/
      Handler: handler.status_handler
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref JobsTable
      Policies:
        # Read-only: the status endpoint never mutates a row.
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
      Events:
        GetTask:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /tasks/{task_id}
            Method: GET
            Auth:
              Authorizer: OidcJwtAuthorizer

  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # API Gateway throttling defaults (#5). AWS::Serverless::HttpApi exposes
      # stage-level default route throttling via DefaultRouteSettings
      # (ThrottlingBurstLimit / ThrottlingRateLimit), which SAM maps onto the
      # HTTP API $default stage. This caps request bursts/sustained rate across
      # all routes so a flood of webhook calls cannot overwhelm the orchestrator
      # (defence in depth alongside verify_webhook). Tune to expected Jira load.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      # ADR-001: OIDC/JWT authorizer for the Kiro IDE routes. The Jira
      # POST /webhook route sets NO Authorizer (so it stays on shared-secret/HMAC
      # verification), and DefaultAuthorizer is intentionally left unset so a
      # route is only protected when it opts in via Auth.Authorizer. API Gateway
      # verifies the token (issuer + audience) before IngressFunction /
      # StatusFunction run; the Lambda only reads the verified claims.
      Auth:
        Authorizers:
          OidcJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Ref OidcIssuerUrl
              audience: !Ref OidcAudience

  # ---------------------------------------------------------------------------
  # ADR-007 D: cost guardrail — ALERT-ONLY budget (NOT a hard fail-closed cap).
  # -----------------------------------------------------------------------------
  # Notifies the SNS topic when actual monthly spend crosses the alert
  # threshold. A HARD dispatch/spend cap that fails closed is DEFERRED on
  # purpose: it can block legitimate work, so we start alert-only and revisit
  # once real usage is observed. Only created when an SNS topic ARN is supplied.
  SpendBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetTopic
    Properties:
      Budget:
        BudgetName: kiro-minions-monthly-spend
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetLimit
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertSnsTopicArn
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertSnsTopicArn

# =============================================================================
# AgentCore Runtime execution role — NOT managed by this stack.
# -----------------------------------------------------------------------------
# The AgentCore Runtime (its container + execution role) is created out-of-band
# by `agentcore launch`, so this SAM stack CANNOT attach IAM to it. Because the
# runtime now writes its own terminal job status to the JobsTable (#6), the
# operator MUST attach the following actions to the Runtime EXECUTION ROLE:
#
#     dynamodb:UpdateItem   (write_job_status SET of status/pr_url/reason)
#     dynamodb:PutItem      (defensive; status writes use UpdateItem today)
#     dynamodb:GetItem      (read-back / future lease inspection)
#
#   Resource: the JobsTable ARN (see JobsTableArn output below).
#
# The runtime also needs DYNAMODB_TABLE (and AWS_REGION) in its environment.
# Pass DYNAMODB_TABLE via the AgentCore Runtime env config (see README "Deploy").
# =============================================================================

Outputs:
  WebhookUrl:
    Description: API Gateway endpoint to configure as the Jira webhook target.
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/webhook"
  TasksIngressUrl:
    Description: >
      Kiro IDE ingress endpoint (POST, OIDC/JWT auth). The IDE extension sends a
      task request here with a Bearer token.
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/tasks"
  TaskStatusUrlTemplate:
    Description: >
      Status polling endpoint template (GET, OIDC/JWT auth). Substitute
      {task_id} with the id returned by POST /tasks and poll until terminal.
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/tasks/{task_id}"
  JobsTableName:
    Description: DynamoDB idempotency / job-status table name.
    Value: !Ref JobsTable
  JobsTableArn:
    Description: >
      DynamoDB table ARN. Attach dynamodb:UpdateItem/PutItem/GetItem on this ARN
      to the AgentCore Runtime execution role (managed outside this stack).
    Value: !GetAtt JobsTable.Arn
  JobsQueueUrl:
    Description: SQS work-queue URL (producer SQS_QUEUE_URL env var).
    Value: !Ref JobsQueue
  JobsDeadLetterQueueArn:
    Description: DLQ ARN for messages that failed delivery maxReceiveCount times.
    Value: !GetAtt JobsDeadLetterQueue.Arn
